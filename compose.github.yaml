# 直接从 GitHub 仓库构建 Docker 版
# 用法：docker compose -f compose.github.yaml up -d --build
services:
  cloud123:
    build:
      context: https://github.com/husbmv/move123.git#main
      # 如需固定到某次提交，可将 #main 改为 #<commit-sha>
    image: move123:latest
    container_name: cloud123
    restart: unless-stopped
    ports:
      - "12315:12315"
    environment:
      TZ: Asia/Shanghai
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TG_PROXY_URL: ${TG_PROXY_URL:-}
      TMDB_PROXY_URL: ${TMDB_PROXY_URL:-}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:12315/api/web-auth/state', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
